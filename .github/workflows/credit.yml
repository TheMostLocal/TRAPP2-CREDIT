# ============================================================
#  >>> DESTINATION: TheMostLocal/TRAPP2-CREDIT   (new repo, z139)
#  >>> FILE PATH:   .github/workflows/credit.yml
#
#  CORPORATE BONDS & SINGLE-NAME CDS, daily at 0730 ET (DTCC's cumulative file for the previous
#  UTC day is complete by then). GitHub cron is UTC: listed for EDT and EST, the gate keeps the
#  0730 ET run. Secrets (Settings → Secrets and variables → Actions):
#    OPENFIGI_API_KEY      optional, free (openfigi.com) - 4x faster bond lists
#    FINRA_CLIENT_ID / FINRA_CLIENT_SECRET   optional - TRACE bond prices once confirmed
# ============================================================
name: Credit (bonds + CDS)

on:
  schedule:
    - cron: '30 11 * * 2-6'    # 0730 EDT (Tue-Sat: the previous trading day's file)
    - cron: '30 12 * * 2-6'    # 0730 EST
  workflow_dispatch:
    inputs:
      backfill:
        description: 'CDS days to (re)read'
        required: false
        default: '5'
      bonds_batch:
        description: 'Companies whose bond lists to (re)build this run (1000 = all of them, ~2 h)'
        required: false
        default: '150'

concurrency:
  group: credit-data
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        name: Eastern-time gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          S="${{ github.event.schedule }}"
          OFF=$(TZ=America/New_York date +%z); OFFH=$((10#${OFF:1:2}))
          UM=$(echo "$S" | awk '{print $1}'); UH=$(echo "$S" | awk '{print $2}')
          ETH=$(( (10#$UH - OFFH + 24) % 24 )); ETM=$(printf '%02d' "$UM")
          if [ "${ETH}:${ETM}" = "7:30" ]; then RUN=true; else RUN=false; fi
          echo "schedule '$S' = ${ETH}:${ETM} ET today (UTC${OFF}) -> run=${RUN}"
          echo "run=${RUN}" >> "$GITHUB_OUTPUT"

  credit:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Single-name CDS (DTCC SEC SBSDR public tape)
        env:
          CDS_BACKFILL_DAYS: ${{ github.event.inputs.backfill || '5' }}
        run: python pipeline/fetch_cds_dtcc.py
        continue-on-error: true
      - name: Bonds (OpenFIGI list + FINRA TRACE probe)
        env:
          BONDS_BATCH: ${{ github.event.inputs.bonds_batch || '150' }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
          FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
        run: python pipeline/fetch_bonds.py
        continue-on-error: true
        timeout-minutes: 210
      - name: Index
        run: python pipeline/build_credit_index.py
      - name: Commit & push (start from the latest main)
        run: |
          git config user.name "valuatio-credit"
          git config user.email "actions@github.com"
          git add -A data
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -q -m "credit: $(TZ=America/New_York date +%Y-%m-%d\ %H%M) ET [skip ci]"
          for k in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then echo "pushed (attempt $k)"; exit 0; fi
            git fetch -q origin main; git merge -X ours origin/main --no-edit -q || true; sleep $((k * 3))
          done
          echo "::warning::push failed after 5 attempts"
